{% comment %}
  Left-hand art panel for login / register.
  Blocks passed via `with`: pill_url, pill_label.
{% endcomment %}
<aside class="auth-art" aria-label="Ripple">
  <svg class="scene" viewBox="0 0 400 640" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <radialGradient id="glow" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#e8e0ff" stop-opacity=".95"/>
        <stop offset=".35" stop-color="#b9a9f5" stop-opacity=".45"/>
        <stop offset="1" stop-color="#b9a9f5" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <!-- moon + expanding ripples -->
    <g class="moon">
    <circle cx="200" cy="190" r="110" fill="url(#glow)"/>
    <circle cx="200" cy="190" r="26" fill="#f3eeff"/>
    <circle class="ring r1" cx="200" cy="190" r="110" fill="none" stroke="#fff" stroke-width="1.5"/>
    <circle class="ring r2" cx="200" cy="190" r="110" fill="none" stroke="#fff" stroke-width="1.5"/>
    <circle class="ring r3" cx="200" cy="190" r="110" fill="none" stroke="#fff" stroke-width="1.5"/>
    </g>
    <!-- dunes -->
    <path d="M0 430 C70 385 150 365 240 395 S370 430 400 410 L400 640 L0 640Z" fill="#5a49a8"/>
    <path d="M0 480 C90 435 180 445 255 478 S360 505 400 488 L400 640 L0 640Z" fill="#3d3174"/>
    <path d="M0 480 C90 435 180 445 255 478 S360 505 400 488" fill="none" stroke="#9a88e0" stroke-opacity=".5" stroke-width="1.2"/>
    <path d="M0 540 C100 505 200 535 300 560 S380 575 400 566 L400 640 L0 640Z" fill="#261f4a"/>
  </svg>

  <div class="auth-art-top">
    <a class="brand" href="{% url 'login' %}">{% include "includes/logo.html" %}<span>Ripple</span></a>
    <a class="auth-pill" href="{{ pill_url }}">{{ pill_label }}
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </div>

  <div class="auth-quote" data-slider>
    <div class="slides" aria-live="off">
      <p class="slide is-active">Let it out.<br>Be heard.</p>
      <p class="slide">Every rant finds<br>a kind listener.</p>
      <p class="slide">Small ripples,<br>kinder days.</p>
    </div>
    <div class="dots">
      <button type="button" class="dot is-active" aria-label="Show message 1"></button>
      <button type="button" class="dot" aria-label="Show message 2"></button>
      <button type="button" class="dot" aria-label="Show message 3"></button>
    </div>
  </div>
</aside>
