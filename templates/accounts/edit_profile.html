{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<h2>Edit Profile</h2>
<form method="post" novalidate>
  {% csrf_token %}
  {{ form.as_p }}
  <button class="primary" type="submit">Save changes</button>
  <a href="{% url 'profile' %}">Cancel</a>
</form>
{% endblock %}
