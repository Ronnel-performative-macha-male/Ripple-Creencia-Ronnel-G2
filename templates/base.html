<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ripple{% endblock %} | Ripple</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6fb; color: #222; }
    nav { background: #3b4a8f; color: #fff; padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
    nav a, nav button { color: #fff; text-decoration: none; background: none; border: none; font-size: 1em; cursor: pointer; padding: 0; }
    nav .brand { font-weight: bold; font-size: 1.2em; }
    nav .spacer { flex: 1; }
    main { max-width: 640px; margin: 20px auto; background: #fff; padding: 24px; border-radius: 10px; }
    .msg { padding: 10px; margin-bottom: 12px; border-radius: 4px; }
    .msg.success { background: #d4edda; color: #155724; }
    .msg.error { background: #f8d7da; color: #721c24; }
    .errorlist { color: #b00; margin: 4px 0; padding-left: 18px; }
    form p { margin: 12px 0; }
    input[type=text], input[type=email], input[type=password], textarea { padding: 8px; width: 100%; }
    button.primary { padding: 8px 16px; cursor: pointer; }
    .card { border: 1px dashed #bbb; border-radius: 8px; padding: 14px; margin: 12px 0; color: #555; }
    .tag { display: inline-block; background: #e6e9f7; border-radius: 12px; padding: 2px 10px; margin: 2px; font-size: 0.9em; }
    .helptext { color: #666; font-size: 0.85em; }
    @media (max-width: 480px) { main { margin: 0; border-radius: 0; } }
  </style>
</head>
<body>
  <nav>
    <a class="brand" href="{% url 'dashboard' %}">Ripple</a>
    {% if user.is_authenticated %}
      <a href="{% url 'dashboard' %}">Dashboard</a>
      <a href="{% url 'profile' %}">Profile</a>
      <span class="spacer"></span>
      <span>{{ user.username }} ({{ user.get_role_display }})</span>
      <form method="post" action="{% url 'logout' %}" style="margin:0">
        {% csrf_token %}
        <button type="submit">Logout</button>
      </form>
    {% else %}
      <span class="spacer"></span>
      <a href="{% url 'login' %}">Login</a>
      <a href="{% url 'register' %}">Register</a>
    {% endif %}
  </nav>
  <main>
    {% for message in messages %}
      <div class="msg {{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
