<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ripple{% endblock %} | Ripple</title>
  <style>
    :root {
      --bg: #f3f5fb;
      --surface: #ffffff;
      --surface-2: #f7f8fd;
      --text: #1f2540;
      --muted: #6a7192;
      --line: #e1e5f2;
      --brand: #4b5fd6;
      --brand-dark: #3646b3;
      --brand-soft: #e8ebfc;
      --teal: #2bb5a6;
      --danger: #c9342c;
      --ok-bg: #e3f6ec;  --ok-text: #14532d;
      --err-bg: #fde8e6; --err-text: #7f1d1d;
      --shadow: 0 1px 2px rgba(31,37,64,.06), 0 8px 24px rgba(31,37,64,.06);
      --radius: 14px;
      --on-brand: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12162b; --surface: #1b2040; --surface-2: #222850;
        --text: #eceffd; --muted: #a2a9cf; --line: #2f3665;
        --brand: #8190ff; --brand-dark: #6676f0; --brand-soft: #2a3170;
        --teal: #4fd1c0; --danger: #ff7b72;
        --on-brand: #12162b;
        --ok-bg: #12382a; --ok-text: #a7f0c7; --err-bg: #461c1c; --err-text: #ffc9c4;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.55; font-size: 16px;
    }
    a { color: var(--brand); text-underline-offset: 3px; }
    a:hover { color: var(--brand-dark); }
    h2 { font-size: 1.6rem; margin: 0 0 .4rem; letter-spacing: -.01em; }
    h3 { font-size: 1.1rem; margin: 1.6rem 0 .4rem; }
    p { margin: .6rem 0; }

    /* ---------- Navigation ---------- */
    nav {
      position: sticky; top: 0; z-index: 10;
      background: var(--surface); border-bottom: 1px solid var(--line);
      padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center;
    }
    nav a, nav button { color: var(--text); text-decoration: none; background: none; border: none; font: inherit; cursor: pointer; padding: 6px 2px; border-bottom: 2px solid transparent; }
    nav a:hover, nav button:hover { color: var(--brand); border-bottom-color: var(--brand); }
    nav .brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.25rem; letter-spacing: -.02em; border: none; color: var(--brand); }
    nav .brand::before {
      content: ""; width: 22px; height: 22px; border-radius: 50%;
      background: radial-gradient(circle, var(--brand) 0 28%, transparent 30% 44%, var(--teal) 46% 58%, transparent 60%);
      box-shadow: 0 0 0 2px var(--brand-soft);
    }
    nav .spacer { flex: 1; }
    nav .who { color: var(--muted); font-size: .9rem; }

    /* ---------- Layout ---------- */
    main {
      max-width: 720px; margin: 28px auto 48px; padding: 28px;
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); box-shadow: var(--shadow);
    }

    /* ---------- Messages ---------- */
    .msg { padding: 12px 14px; margin-bottom: 16px; border-radius: 10px; border-left: 4px solid; font-weight: 500; }
    .msg.success { background: var(--ok-bg); color: var(--ok-text); border-color: #22a35a; }
    .msg.error { background: var(--err-bg); color: var(--err-text); border-color: var(--danger); }
    .errorlist { color: var(--danger); margin: 4px 0; padding-left: 0; list-style: none; font-size: .9rem; }

    /* ---------- Forms ---------- */
    form p { margin: 16px 0; }
    form p label { display: block; font-weight: 600; margin-bottom: 6px; }
    form p:has(input[type=checkbox]) { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
    form p:has(input[type=checkbox]) label { margin: 0; }
    input[type=text], input[type=email], input[type=password], textarea, select {
      width: 100%; padding: 11px 12px; font: inherit; color: var(--text);
      background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
    }
    textarea { resize: vertical; }
    input:focus, textarea:focus, select:focus, button:focus-visible, a:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--brand) 40%, transparent); outline-offset: 1px; border-color: var(--brand);
    }
    input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--brand); }
    form div[id$="tags"] { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    form div[id$="tags"] > div label { display: inline-flex; align-items: center; gap: 6px; background: var(--brand-soft); border-radius: 999px; padding: 5px 12px; font-weight: 500; cursor: pointer; }
    .helptext, form .helptext { color: var(--muted); font-size: .85rem; display: block; margin-top: 4px; }
    form ul { color: var(--muted); font-size: .85rem; padding-left: 18px; }

    /* ---------- Buttons ---------- */
    button.primary, a.button {
      display: inline-block; padding: 10px 20px; border: none; border-radius: 10px;
      background: var(--brand); color: var(--on-brand); font: inherit; font-weight: 600; text-decoration: none; cursor: pointer;
      box-shadow: 0 2px 0 var(--brand-dark); transition: transform .08s, background .15s;
    }
    button.primary:hover, a.button:hover { background: var(--brand-dark); color: var(--on-brand); }
    button.primary:active, a.button:active { transform: translateY(1px); box-shadow: none; }
    button.danger { padding: 10px 20px; border: none; border-radius: 10px; background: var(--danger); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }

    /* ---------- Cards, stats, tags ---------- */
    .card { border: 1px dashed var(--line); background: var(--surface-2); border-radius: 12px; padding: 14px 16px; margin: 12px 0; color: var(--muted); }
    .card strong { color: var(--text); }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 16px 0; }
    .stats .card { text-align: center; border: 1px solid var(--line); margin: 0; }
    .stats .card strong { display: block; font-size: 1.9rem; line-height: 1.2; color: var(--brand); }
    .tag { display: inline-block; background: var(--brand-soft); color: var(--brand-dark); border-radius: 999px; padding: 2px 10px; margin: 2px; font-size: .8rem; font-weight: 600; }
    @media (prefers-color-scheme: dark) { .tag { color: var(--text); } }

    /* ---------- Rants ---------- */
    .rant { border: 1px solid var(--line); border-left: 4px solid var(--teal); border-radius: 12px; padding: 16px 18px; margin: 16px 0; background: var(--surface-2); }
    .rant h3 { margin: 0 0 2px; font-size: 1.15rem; }
    .meta { color: var(--muted); font-size: .85rem; margin-bottom: 10px; }
    .rant-body { white-space: pre-wrap; overflow-wrap: anywhere; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-top: 14px; }
    .actions form { margin: 0; }
    .actions > a { font-size: .9rem; font-weight: 600; text-decoration: none; padding: 4px 6px; border-radius: 6px; }
    .actions > a:hover { background: var(--brand-soft); }
    .react {
      background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 999px;
      padding: 6px 14px; cursor: pointer; font: inherit; font-size: .9rem; transition: transform .08s, background .15s, border-color .15s;
    }
    .react:hover { border-color: var(--brand); transform: translateY(-1px); }
    .react.active { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
    .private-note { background: var(--brand-soft); border-radius: 10px; padding: 8px 12px; font-size: .85rem; color: var(--text); margin-top: 12px; }
    .pager { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; color: var(--muted); }

    /* ---------- Phones ---------- */
    @media (max-width: 560px) {
      nav { padding: 8px 14px; gap: 4px 14px; }
      nav .who { display: none; }
      main { margin: 0; border-radius: 0; border-left: none; border-right: none; box-shadow: none; padding: 20px 16px 40px; min-height: calc(100vh - 56px); }
      h2 { font-size: 1.4rem; }
      .react { padding: 7px 12px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <nav>
    <a class="brand" href="{% url 'dashboard' %}">Ripple</a>
    {% if user.is_authenticated %}
      <a href="{% url 'dashboard' %}">Dashboard</a>
      <a href="{% url 'board:list' %}">Rant Board</a>
      <a href="{% url 'profile' %}">Profile</a>
      <span class="spacer"></span>
      <span class="who">{{ user.username }} ({{ user.get_role_display }})</span>
      <form method="post" action="{% url 'logout' %}" style="margin:0">
        {% csrf_token %}
        <button type="submit">Logout</button>
      </form>
    {% else %}
      <span class="spacer"></span>
      <a href="{% url 'login' %}">Login</a>
      <a href="{% url 'register' %}">Register</a>
    {% endif %}
  </nav>
  <main>
    {% for message in messages %}
      <div class="msg {{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
